<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MGG STORE V10</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Noto Sans Khmer",sans-serif;
 background:#070812;
 color:#fff;
}
header{
 padding:22px 15px;
 text-align:center;
 background:linear-gradient(135deg,#15182b,#080912);
 border-bottom:1px solid #292c42;
}
.logo{font-size:30px;font-weight:900}
.logo span{color:#ff7900}
.sub{color:#aeb3c8;margin-top:7px;font-size:13px}

.hero{
 margin:18px auto;
 max-width:1100px;
 padding:0 15px;
}
.heroBox{
 text-align:center;
 padding:30px 18px;
 border-radius:24px;
 background:linear-gradient(135deg,#ff9b00,#ff4300);
 box-shadow:0 15px 40px #ff5b0025;
}
.heroBox h1{margin:0 0 8px;font-size:29px}
.heroBox p{margin:0;color:#fff0dc}
.badges{
 display:flex;
 justify-content:center;
 gap:8px;
 flex-wrap:wrap;
 margin-top:18px;
}
.badge{
 padding:8px 12px;
 border-radius:50px;
 background:#0003;
 font-size:12px;
}

.container{
 max-width:1100px;
 margin:auto;
 padding:0 15px 40px;
}
.title{
 font-size:21px;
 font-weight:bold;
 margin:25px 0 14px;
}
.games{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
}
.card{
 background:#111321;
 border:1px solid #292d42;
 border-radius:20px;
 overflow:hidden;
 transition:.2s;
}
.card:hover{
 transform:translateY(-4px);
 border-color:#ff7900;
}
.cover{
 height:145px;
 display:flex;
 justify-content:center;
 align-items:center;
 font-weight:900;
 font-size:22px;
 position:relative;
}
.cover:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(transparent,#0009);
}
.cover span{position:relative;z-index:2}
.ff{background:linear-gradient(135deg,#ffae00,#e52d00)}
.ml{background:linear-gradient(135deg,#252cae,#7d28df)}
.rb{background:linear-gradient(135deg,#222,#555)}
.more{background:linear-gradient(135deg,#202438,#10121d)}

.info{padding:14px}
.info h3{margin:0 0 6px}
.info p{margin:0 0 13px;color:#999fb5;font-size:13px}

.buy{
 width:100%;
 padding:12px;
 border:0;
 border-radius:12px;
 background:linear-gradient(135deg,#ffb000,#ff5500);
 color:white;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
}
.buy:active{transform:scale(.97)}

.features{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
