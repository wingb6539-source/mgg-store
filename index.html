<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGG STORE | Diamond Top Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      color: white;
      background:
        radial-gradient(circle at top, #243b80 0%, transparent 35%),
        linear-gradient(135deg, #050816, #0b1026 55%, #050816);
      padding: 25px 15px 50px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #70d9ff;
      text-shadow: 0 0 20px #008cff;
    }

    .subtitle {
      color: #b8c5e8;
      margin-top: 8px;
    }

    .card {
      background: rgba(13, 20, 48, 0.88);
      border: 1px solid rgba(93, 181, 255, 0.25);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .game {
      padding: 15px;
      border-radius: 14px;
      background: #111a38;
      border: 1px solid #27345f;
      cursor: pointer;
      text-align: center;
      transition: .2s;
    }

    .game:hover,
    .game.active {
      border-color: #58c7ff;
      background: #15264d;
      transform: translateY(-2px);
    }

    .diamond-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .diamond {
      padding: 18px 10px;
      border-radius: 16px;
      background: #101938;
      border: 1px solid #2a3968;
      color: white;
      cursor: pointer;
      text-align: center;
      transition: .2s;
    }

    .diamond:hover,
    .diamond.selected {
      border-color: #62d5ff;
      box-shadow: 0 0 18px rgba(58,190,255,.25);
      background: #142750;
    }

    .diamond b {
      display: block;
      font-size: 19px;
      color: #7cdbff;
      margin-bottom: 5px;
    }

    .pass {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 17px;
      border-radius: 16px;
      background: linear-gradient(90deg, #172755, #111a38);
      border: 1px solid #30477d;
      cursor: pointer;
    }

    .pass.selected {
      border-color: #62d5ff;
      box-shadow: 0 0 20px rgba(58,190,255,.2);
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 9px;
      margin-bottom: 14px;
      border: 1px solid #2b3b6b;
      border-radius: 13px;
      background: #080e22
