<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGG STORE — Game Top Up</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Khmer",sans-serif;
  background:linear-gradient(180deg,#ff8a00,#ff4b00 45%,#b90000);
  color:white;
}
header{
  text-align:center;
  padding:28px 15px;
  background:rgba(0,0,0,.25);
}
header h1{margin:0;font-size:32px}
header p{margin:8px 0 0;color:#ffe9c7}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;
}

.game{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  padding:15px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.game img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:14px;
}

.game h2{margin:12px 0 8px}

.buy{
  width:100%;
  border:0;
  border-radius:12px;
  padding:12px;
  background:#ffd000;
  color:#222;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.buy:hover{background:#fff}

.safe{
  text-align:center;
  margin:25px 0 5px;
  padding:15px;
  border-radius:15px;
  background:rgba(0,0,0,.2);
}

/* Modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:10;
  padding:20px;
  overflow:auto;
}

.box{
  max-width:500px;
  margin:30px auto;
  background:#fff;
  color:#222;
  border-radius:20px;
  padding:22px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:10px;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  cursor:pointer;
  font-size:20px;
}

.box h2{margin-top:5px}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  margin-top:7px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.check{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#222;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.status{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  display:none;
}

.confirm{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#ff6a00;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.telegram{
  display:block;
  text-align:center;
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  background:#168de2;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.note{
  font-size:13px;
  color:#666;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h1>🔥 MGG STORE 🔥</h1>
  <p>លឿន • រហ័ស • សុវត្ថិភាព • តម្លៃសមរម្យ</p>
</header>

<div class="container">

  <div class="games">

    <!-- Free Fire -->
    <div class="game">
      <img src="https://placehold.co/600x400/orange/white?text=FREE+FIRE"
           alt="Free Fire">
      <h2>🔥 Free Fire</h2>
      <p>Diamonds Top Up</p>
      <button class="buy" onclick="openShop('Free Fire')">
        🛒 ចូលទិញ
      </button>
    </div>

    <!-- Mobile Legends -->
    <div class="game">
      <img src="https://placehold.co/600x400/6a35d4/white?text=MOBILE+LEGENDS"
           alt="Mobile Legends">
      <h2>⚔️ Mobile Legends</h2>
      <p>Diamonds Top Up</p>
      <button class="buy" onclick="openShop('Mobile Legends')">
        🛒 ចូលទិញ
      </button>
    </div>

    <!-- Roblox -->
    <div class="game">
      <img src="https://placehold.co/600x400/222/white?text=ROBLOX"
           alt="Roblox">
      <h2>🎮 Roblox</h2>
      <p>Robux Top Up</p>
      <button class="buy" onclick="openShop('Roblox')">
        🛒 ចូលទិញ
      </button>
    </div>

    <!-- More -->
    <div class="game">
      <img src="https://placehold.co/600x400/333/white?text=MORE+GAMES"
           alt="More Games">
      <h2>🎮 More Games</h2>
      <p>Coming Soon</p>
      <button class="buy" onclick="openShop('More Games')">
        🛒 ចូលទិញ
      </button>
    </div>

  </div>

  <div class="safe">
    🛡️ <b>សុវត្ថិភាព</b><br>
    យើងមិនស្នើសុំ Password ឬ OTP របស់អ្នកទេ។
  </div>

</div>


<!-- BUY MODAL -->
<div class="modal" id="shopModal">

  <div class="box">

    <button class="close" onclick="closeShop()">×</button>

    <h2 id="gameTitle">🛒 ទិញ</h2>

    <label>💎 រើសកញ្ចប់ / តម្លៃ</label>

    <select id="package">
      <option value="100 Diamonds - $1">💎 100 Diamonds — $1</option>
      <option value="310 Diamonds - $3">💎 310 Diamonds — $3</option>
      <option value="520 Diamonds - $5">💎 520 Diamonds — $5</option>
      <option value="1060 Diamonds - $10">💎 1060 Diamonds — $10</option>
      <option value="Weekly Pass - $2">⭐ Weekly Pass — $2</option>
    </select>

    <label>🎮 Game ID</label>

    <input
      id="gameId"
      type="text"
      inputmode="numeric"
      placeholder="បញ្ចូល Game ID"
      maxlength="20"
    >

    <button class="check" onclick="checkID()">
      🔎 ពិនិត្យ ID
    </button>

    <div id="status" class="status"></div>

    <button class="confirm" onclick="confirmOrder()">
      🧾 បញ្ជាក់ការទិញ
    </button>

    <a
      class="telegram"
      href="https://t.me/MGGStoreAdmin"
      target="_blank">
      📲 ទាក់ទង Admin
    </a>

    <div class="note">
      🛡️ មិនត្រូវបញ្ចូល Password ឬ OTP នៅទីនេះទេ។
    </div>

  </div>
</div>


<script>

let selectedGame = "";

function openShop(game){

  selectedGame = game;

  document.getElementById("gameTitle").innerText =
    "🛒 " + game + " — ចូលទិញ";

  document.getElementById("shopModal").style.display = "block";

  document.getElementById("gameId").value = "";

  document.getElementById("status").style.display = "none";
}


function closeShop(){

  document.getElementById("shopModal").style.display = "none";

}


function checkID(){

  const id = document.getElementById("gameId").value.trim();
  const status = document.getElementById("status");

  status.style.display = "block";

  if(id.length < 5){

    status.style.background = "#ffe0e0";
    status.style.color = "#b00000";

    status.innerText =
      "❌ Game ID មិនទាន់ត្រឹមត្រូវ។ សូមពិនិត្យម្ដងទៀត។";

    return;
  }

  status.style.background = "#dfffe5";
  status.style.color = "#08752a";

  status.innerText =
    "✅ ទម្រង់ Game ID ត្រឹមត្រូវ។ សូមពិនិត្យព័ត៌មានមុនបញ្ជាទិញ។";
}


function confirmOrder(){

  const id = document.getElementById("gameId").value.trim();

  const pack =
    document.getElementById("package").value;

  if(id.length < 5){

    alert("សូមបញ្ចូល និងពិនិត្យ Game ID ជាមុនសិន។");

    return;
  }

  const message =
    "MGG STORE%0A" +
    "🎮 Game: " + encodeURIComponent(selectedGame) + "%0A" +
    "💎 Package: " + encodeURIComponent(pack) + "%0A" +
    "🆔 Game ID: " + encodeURIComponent(id);

  window.open(
    "https://t.me/MGGStoreAdmin?text=" + message,
    "_blank"
  );
}


window.onclick = function(event){

  const modal =
    document.getElementById("shopModal");

  if(event.target === modal){

    closeShop();

  }

}

</script>

</body>
        </html>
