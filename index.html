<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGG STORE V2026</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:
    radial-gradient(circle at top,#35120d,#100708 45%,#070304);
  color:white;
  min-height:100vh;
}

header{
  padding:22px 18px;
  text-align:center;
  background:linear-gradient(135deg,#ff4b00,#ff1300);
  box-shadow:0 0 30px #ff3b00;
}

.logo{
  font-size:32px;
  font-weight:900;
  letter-spacing:2px;
}

.subtitle{
  margin-top:6px;
  opacity:.9;
}

.container{
  width:min(1000px,94%);
  margin:25px auto;
}

.section-title{
  font-size:22px;
  font-weight:bold;
  margin:25px 0 15px;
}

.games{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.game{
  padding:20px 10px;
  border:1px solid #ff4b2244;
  border-radius:18px;
  background:linear-gradient(145deg,#21100d,#120809);
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.game:hover,
.game.active{
  transform:translateY(-3px);
  border-color:#ff4b00;
  box-shadow:0 0 20px #ff3b0044;
}

.game-icon{
  font-size:38px;
  margin-bottom:8px;
}

.game-name{
  font-weight:bold;
}

.card{
  background:#160a09dd;
  border:1px solid #ff4b0038;
  border-radius:20px;
  padding:20px;
  margin-top:20px;
}

label{
  display:block;
  margin:12px 0 7px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #54241c;
  background:#0d0606;
  color:white;
  outline:none;
}

input:focus,select:focus{
  border-color:#ff4b00;
}

.packages{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.package{
  padding:15px 8px;
  border:1px solid #4b211b;
  border-radius:14px;
  background:#110707;
  cursor:pointer;
  text-align:center;
}

.package.active{
  border-color:#ff4b00;
  background:#351008;
  box-shadow:0 0 15px #ff3b003
