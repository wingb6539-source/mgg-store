<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGG STORE - Diamond Top Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: rgba(0,0,0,0.35);
    }

    header h1 {
      font-size: 32px;
      color: #38bdf8;
    }

    header p {
      margin-top: 8px;
      color: #ddd;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .card h2 {
      margin-bottom: 15px;
      color: #38bdf8;
    }

    .diamond {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.25);
      padding: 15px;
      border-radius: 12px;
      margin: 10px 0;
    }

    .diamond button {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .diamond button:hover {
      background: #0284c7;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    .telegram {
      display: block;
      text-align: center;
      background: #229ed9;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <h1>💎 MGG STORE</h1>
    <p>Diamond Top Up</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>💎 ជ្រើសរើស Diamond</h2>

      <div class="diamond">
        <span>💎 100 Diamonds</span>
        <button onclick="selectDiamond('100 Diamonds')">ជ្រើសរើស</button>
      </div>

      <div class="diamond">
        <span>💎 310 Diamonds</span>
        <button onclick="selectDiamond('310 Diamonds')">ជ្រើសរើស</button>
      </div>

      <div class="diamond">
        <span>💎 520 Diamonds</span>
        <button onclick="selectDiamond('520 Diamonds')">ជ្រើសរើស</button>
      </div>

      <div class="diamond">
        <span>💎 1060 Diamonds</span>
        <button onclick="selectDiamond('1060 Diamonds')">ជ្រើសរើស</button>
      </div>
    </div>

    <div class="card">
      <h2>👤 ព័ត៌មាន Account</h2>

      <input type="text" id="gameID" placeholder="បញ្ចូល Game ID">

      <input type="text" id="serverID" placeholder="បញ្ចូល Server ID">

      <input type="text" id="package" placeholder="Diamond ដែលបានជ្រើសរើស" readonly>

      <a class="telegram"
         href="https://t.me/MGGStoreAdmin"
         target="_blank">
        📩 Order តាម Telegram Admin
      </a>
    </div>

  </div>

  <footer>
    © 2026 MGG STORE — Diamond Top Up
  </footer>

  <script>
    function selectDiamond(name) {
      document.getElementById("package").value = name;
      alert("បានជ្រើសរើស: " + name);
    }
  </script>

</body>
  </html>
