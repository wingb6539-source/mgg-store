<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGG STORE — Admin Panel V2026</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff7a00, #ff3d00);
      min-height: 100vh;
      color: #222;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      color: #ff4b00;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .input:focus {
      border-color: #ff6200;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    .btn-primary {
      width: 100%;
      background: #ff5500;
      color: white;
    }

    .btn-secondary {
      background: #222;
      color: white;
    }

    .error {
      color: #e00000;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
      background: #f5f5f5;
    }

    .topbar {
      background: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
      color: #ff4b00;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: #777;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .stat-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 900;
    }

    .orders-box {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .orders-header h2 {
      font-size: 21px;
    }

    .order {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .order-id {
      font-weight: 900;
      color: #ff4b00;
      word-break: break-word;
    }

    .status {
      padding: 5px 9px;
      border-radius: 20px;
      background: #fff1e8;
      color: #ff5500;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .status.completed {
      background: #e8fff0;
      color: #07963d;
    }

    .order-info {
      display: grid;
      gap: 7px;
      color: #555;
      font-size: 14px;
    }

    .order-info b {
      color: #222;
    }

    .empty {
      text-align: center;
      padding: 40px 15px;
      color: #777;
    }

    .loading {
      color: #ff5500;
    }

    .success {
      color: #07963d;
      font-weight: bold;
    }

    small {
      word-break: break-word;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .top-actions .btn {
        flex: 1;
      }

      .orders-header {
        flex-direction: column;
        align-items: stretch;
      }

      .orders-header .btn {
        width: 100%;
      }
    }
  </style></head><body>  <!-- LOGIN -->  <div class="login-page" id="loginPage"><div class="login-box">

  <div class="logo">
    MGG STORE
  </div>

  <div class="subtitle">
    Admin Panel V2026
  </div>

  <input
    class="input"
    id="username"
    type="text"
    placeholder="Username"
    autocomplete="username"
  >

  <input
    class="input"
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button class="btn btn-primary" onclick="login()">
    🔐 Login
  </button>

  <div class="error" id="loginError"></div>

</div>

  </div>  <!-- DASHBOARD -->  <div class="dashboard" id="dashboard"><div class="topbar">

  <div class="brand">
    🛒 MGG STORE ADMIN
  </div>

  <div class="top-actions">

    <button
      class="btn btn-secondary"
      onclick="loadOrders()"
    >
      🔄 Refresh
    </button>

    <button
      class="btn btn-secondary"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>


<div class="container">

  <div class="welcome">
    <h1>Welcome Admin 👋</h1>
    <p>Manage MGG STORE orders</p>
  </div>


  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <div class="stat-title">
        Total Orders
      </div>

      <div
        class="stat-number"
        id="totalOrders"
      >
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-title">
        Pending Payment
      </div>

      <div
        class="stat-number"
        id="pendingOrders"
      >
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-title">
        Completed
      </div>

      <div
        class="stat-number"
        id="completedOrders"
      >
        0
      </div>
    </div>

  </div>


  <!-- ORDERS -->
  <div class="orders-box">

    <div class="orders-header">

      <h2>
        📦 Orders
      </h2>

      <button
        class="btn btn-secondary"
        onclick="loadOrders()"
      >
        🔄 Reload Orders
      </button>

    </div>

    <div id="orders">
      <div class="empty">
        Loading orders...
      </div>
    </div>

  </div>

</div>

  </div>  <script>

    /* =========================
       CONFIG
    ========================= */

    const BACKEND_URL =
      "https://mgg-store-backend.onrender.com";


    /* =========================
       ADMIN LOGIN
    ========================= */

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "mgg2026";


    function login() {

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("loginError");


      if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
      ) {

        localStorage.setItem(
          "mgg_admin_login",
          "true"
        );

        document.getElementById(
          "loginPage"
        ).style.display = "none";

        document.getElementById(
          "dashboard"
        ).style.display = "block";

        loadOrders();

      } else {

        error.textContent =
          "❌ Username or password is incorrect";

      }

    }


    function logout() {

      localStorage.removeItem(
        "mgg_admin_login"
      );

      location.reload();

    }


    /* =========================
       CHECK LOGIN
    ========================= */

    if (
      localStorage.getItem(
        "mgg_admin_login"
      ) === "true"
    ) {

      document.getElementById(
        "loginPage"
      ).style.display = "none";

      document.getElementById(
        "dashboard"
      ).style.display = "block";

      loadOrders();

    }


    /* =========================
       LOAD ORDERS
    ========================= */

    async function loadOrders() {

      const box =
        document.getElementById("orders");


      box.innerHTML = `
        <div class="empty loading">
          ⏳ Connecting to MGG Backend...
        </div>
      `;


      try {

        const response = await fetch(
          `${BACKEND_URL}/api/orders`,
          {
            method: "GET",
            cache: "no-store"
          }
        );


        const text =
          await response.text();


        console.log(
          "Backend status:",
          response.status
        );

        console.log(
          "Backend response:",
          text
        );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status +
            ": " +
            text
          );

        }


        const data =
          JSON.parse(text);


        const orders =
          Array.isArray(data)
            ? data
            : Array.isArray(data.orders)
              ? data.orders
              : [];


        updateStats(orders);
        renderOrders(orders);


      } catch (error) {

        console.error(
          "Backend error:",
          error
        );


        box.innerHTML = `
          <div class="empty">

            ❌ Backend Connection Error

            <br><br>

            <small>
              ${escapeHTML(error.message)}
            </small>

            <br><br>

            <button
              class="btn btn-secondary"
              onclick="loadOrders()"
            >
              🔄 Try Again
            </button>

          </div>
        `;

      }

    }


    /* =========================
       UPDATE STATS
    ========================= */

    function updateStats(orders) {

      document.getElementById(
        "totalOrders"
      ).textContent = orders.length;


      const pending =
        orders.filter(order => {

          const status =
            String(order.status || "")
              .toUpperCase();

          return (
            status === "PENDING_PAYMENT" ||
            status === "PAYMENT_PENDING"
          );

        }).length;


      const completed =
        orders.filter(order => {

          const status =
            String(order.status || "")
              .toUpperCase();

          return (
            status === "COMPLETED" ||
            status === "SUCCESS" ||
            status === "SUCCESSFUL"
          );

        }).length;


      document.getElementById(
        "pendingOrders"
      ).textContent = pending;


      document.getElementById(
        "completedOrders"
      ).textContent = completed;

    }


    /* =========================
       RENDER ORDERS
    ========================= */

    function renderOrders(orders) {

      const box =
        document.getElementById("orders");


      if (!orders.length) {

        box.innerHTML = `
          <div class="empty">
            📭 No orders yet
          </div>
        `;

        return;

      }


      box.innerHTML =
        orders
          .slice()
          .reverse()
          .map(order => {

            const orderId =
              order.orderId ||
              order.customerOrderId ||
              "NO ID";


            const playerId =
              order.player_id ||
              order.playerId ||
              "-";


            const status =
              order.status ||
              "UNKNOWN";


            const statusClass =
              String(status)
                .toUpperCase()
                .includes("COMPLETED") ||
              String(status)
                .toUpperCase()
                .includes("SUCCESS")
                ? "completed"
                : "";


            const price =
              order.price !== undefined &&
              order.price !== null
                ? "$" +
                  Number(order.price)
                    .toFixed(2)
                : "-";


            let created =
              order.createdAt || "-";


            if (created !== "-") {

              try {

                created =
                  new Date(created)
                    .toLocaleString();

              } catch (_) {}

            }


            return `

              <div class="order">

                <div class="order-top">

                  <div class="order-id">
                    🆔 ${escapeHTML(orderId)}
                  </div>

                  <div class="status ${statusClass}">
                    ${escapeHTML(status)}
                  </div>

                </div>


                <div class="order-info">

                  <div>
                    🎮 Game:
                    <b>
                      ${escapeHTML(
                        order.game || "-"
                      )}
                    </b>
                  </div>


                  <div>
                    💎 Package:
                    <b>
                      ${escapeHTML(
                        order.package || "-"
                      )}
                    </b>
                  </div>


                  <div>
                    👤 Player ID:
                    <b>
                      ${escapeHTML(playerId)}
                    </b>
                  </div>


                  <div>
                    💵 Price:
                    <b>
                      ${escapeHTML(price)}
                    </b>
                  </div>


                  <div>
                    🕒 Created:
                    <small>
                      ${escapeHTML(created)}
                    </small>
                  </div>

                </div>

              </div>

            `;

          })
          .join("");

    }


    /* =========================
       SECURITY
    ========================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script></body>
  </html>
