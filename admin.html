<!DOCTYPE html><html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGG STORE Admin</title>  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans Khmer", sans-serif;
      background: #111;
      color: white;
    }

    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 390px;
      padding: 30px;
      border-radius: 22px;
      background: #1d1d1d;
      text-align: center;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(135deg,#ff9d00,#ff3b00);
      font-size: 24px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #111;
      color: white;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      color: white;
      background: #ff6500;
      font-weight: bold;
      cursor: pointer;
    }

    .login button {
      width: 100%;
      margin-top: 16px;
    }

    #message {
      color: #ff5555;
      min-height: 20px;
    }

    #dashboard {
      display: none;
      padding: 25px;
      max-width: 1100px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    .stat, .order {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 20px;
    }

    .stat span {
      color: #aaa;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
    }

    .orders {
      display: grid;
      gap: 15px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .status {
      padding: 6px 10px;
      border-radius: 8px;
      background: #333;
      font-size: 12px;
    }

    .info {
      margin-top: 12px;
      color: #ccc;
      line-height: 1.8;
    }

    .refresh {
      background: #333;
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: #999;
      background: #1d1d1d;
      border-radius: 16px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
      }
    }
  </style></head><body>  <!-- LOGIN -->  <div class="login" id="loginPage">
    <div class="box">
      <div class="logo">MGG</div>  <h1>MGG STORE</h1>
  <p>Admin Panel V2026</p>

  <input id="username" type="text" placeholder="Admin username">
  <input id="password" type="password" placeholder="Admin password">

  <button onclick="login()">🔐 Login</button>

  <p id="message"></p>
</div>

  </div>  <!-- DASHBOARD -->  <div id="dashboard"><div class="top">
  <div>
    <h1>🔥 MGG STORE ADMIN</h1>
    <p>Order Dashboard</p>
  </div>

  <div>
    <button class="refresh" onclick="loadOrders()">🔄 Refresh</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>
</div>


<div class="stats">

  <div class="stat">
    <span>📦 Total Orders</span>
    <strong id="total">0</strong>
  </div>

  <div class="stat">
    <span>⏳ Pending</span>
    <strong id="pending">0</strong>
  </div>

  <div class="stat">
    <span>✅ Completed</span>
    <strong id="completed">0</strong>
  </div>

</div>


<div id="orders" class="orders"></div>

  </div>  <script>

    const API_URL =
      "https://mgg-store-backend.onrender.com";

    function login() {

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      if (username === "admin" && password === "mgg2026") {

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("dashboard").style.display = "block";

        loadOrders();

      } else {

        document.getElementById("message").textContent =
          "❌ Username ឬ Password មិនត្រឹមត្រូវ";

      }
    }


    function logout() {

      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginPage").style.display = "flex";

    }


    async function loadOrders() {

      const ordersBox =
        document.getElementById("orders");

      ordersBox.innerHTML =
        '<div class="empty">⏳ Loading orders...</div>';

      try {

        const response =
          await fetch(API_URL + "/api/orders");

        if (!response.ok) {
          throw new Error("Server error");
        }

        const data = await response.json();

        const orders =
          Array.isArray(data) ? data :
          Array.isArray(data.orders) ? data.orders :
          [];

        updateStats(orders);
        displayOrders(orders);

      } catch (error) {

        ordersBox.innerHTML = `
          <div class="empty">
            ❌ Cannot connect to Backend<br><br>
            ${error.message}
          </div>
        `;

      }
    }


    function updateStats(orders) {

      document.getElementById("total").textContent =
        orders.length;

      document.getElementById("pending").textContent =
        orders.filter(
          o => o.status === "PENDING_PAYMENT"
        ).length;

      document.getElementById("completed").textContent =
        orders.filter(
          o => o.status === "COMPLETED"
        ).length;
    }


    function displayOrders(orders) {

      const box =
        document.getElementById("orders");

      if (!orders.length) {

        box.innerHTML = `
          <div class="empty">
            📦 No orders yet
          </div>
        `;

        return;
      }

      box.innerHTML = orders.map(order => `

        <div class="order">

          <div class="order-top">
            <strong>
              ${escapeHTML(order.orderId || "-")}
            </strong>

            <span class="status">
              ${escapeHTML(order.status || "-")}
            </span>
          </div>

          <div class="info">

            🎮 Game:
            ${escapeHTML(order.game || "-")}
            <br>

            👤 Player ID:
            ${escapeHTML(order.playerId || "-")}
            <br>

            💎 Package:
            ${escapeHTML(order.package || "-")}
            <br>

            🕒 Created:
            ${escapeHTML(order.createdAt || "-")}

          </div>

        </div>

      `).join("");
    }


    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

  </script></body>
  </html>
