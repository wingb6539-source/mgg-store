<!DOCTYPE html><html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGG STORE Admin</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Noto Sans Khmer", sans-serif;
      background: #111;
      color: white;
    }

    .box {
      width: 90%;
      max-width: 380px;
      padding: 30px;
      border-radius: 22px;
      background: #1d1d1d;
      text-align: center;
      box-shadow: 0 20px 60px #000;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(135deg,#ff9d00,#ff3b00);
      font-size: 24px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #aaa;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg,#ff9d00,#ff3b00);
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      color: #ff5555;
      min-height: 20px;
    }

    #dashboard {
      display: none;
      width: 90%;
      max-width: 800px;
      padding: 30px;
      border-radius: 22px;
      background: #1d1d1d;
    }

    .stat {
      margin-top: 20px;
      padding: 25px;
      border-radius: 15px;
      background: #111;
    }
  </style></head><body>  <!-- LOGIN -->  <div class="box" id="loginBox"><div class="logo">MGG</div>

<h1>MGG STORE</h1>
<p>Admin Panel V2026</p>

<input
  id="username"
  type="text"
  placeholder="Admin username"
>

<input
  id="password"
  type="password"
  placeholder="Admin password"
>

<button onclick="login()">🔐 Login</button>

<p id="message"></p>

  </div>  <!-- DASHBOARD -->  <div id="dashboard"><h1>🔥 MGG STORE ADMIN</h1>
<p>Welcome to Admin Panel V2026</p>

<div class="stat">
  📦 Total Orders
  <h2>0</h2>
</div>

<button onclick="logout()">🚪 Logout</button>

  </div>  <script>
    function login() {

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      if (username === "admin" && password === "mgg2026") {

        document.getElementById("loginBox").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

      } else {

        document.getElementById("message").textContent =
          "❌ Username ឬ Password មិនត្រឹមត្រូវ";

      }
    }

    function logout() {

      document.getElementById("dashboard").style.display = "none";

      document.getElementById("loginBox").style.display = "block";

      document.getElementById("username").value = "";

      document.getElementById("password").value = "";
    }
  </script></body>
</html>
