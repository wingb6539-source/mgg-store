<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGG STORE — Admin Panel</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#0b0f19;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#151b2b;
  border:1px solid #29334d;
  border-radius:20px;
  padding:30px;
  box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span{
  color:#ff6b00;
}

.subtitle{
  text-align:center;
  color:#9da7ba;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:12px;
  border:1px solid #303b55;
  background:#0e1422;
  color:white;
  outline:none;
}

input:focus{
  border-color:#ff6b00;
}

button{
  border:0;
  cursor:pointer;
  border-radius:10px;
  padding:11px 15px;
  font-weight:bold;
}

.login-btn{
  width:100%;
  background:#ff6b00;
  color:white;
  font-size:16px;
}

.login-btn:hover{
  background:#ff7f26;
}

#error{
  color:#ff6262;
  text-align:center;
  margin-top:12px;
  display:none;
}

/* ADMIN */

#adminPage{
  display:none;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.header h1{
  font-size:28px;
}

.header h1 span{
  color:#ff6b00;
}

.logout{
  background:#252d40;
  color:white;
}

.refresh{
  background:#ff6b00;
  color:white;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#151b2b;
  border:1px solid #29334d;
  padding:20px;
  border-radius:16px;
}

.stat small{
  color:#9da7ba;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.orders{
  background:#151b2b;
  border:1px solid #29334d;
  border-radius:18px;
  padding:20px;
  overflow:hidden;
}

.orders-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.order{
  background:#0e1422;
  border:1px solid #29334d;
  border-radius:14px;
  padding:18px;
  margin-bottom:12px;
}

.order:last-child{
  margin-bottom:0;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.order-id{
  color:#ff9a55;
  font-weight:bold;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#3b3017;
  color:#ffd166;
}

.paid{
  background:#163c2b;
  color:#54e39a;
}

.completed{
  background:#17344b;
  color:#55baff;
}

.cancelled{
  background:#431d24;
  color:#ff7c89;
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  color:#c8cfdd;
  font-size:14px;
}

.info b{
  color:white;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}

.paid-btn{
  background:#159447;
  color:white;
}

.complete-btn{
  background:#147fc1;
  color:white;
}

.cancel-btn{
  background:#b52c3b;
  color:white;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#8e98aa;
}

.loading{
  text-align:center;
  padding:30px;
  color:#9da7ba;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .info{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:22px;
  }
}
</style></head><body><!-- LOGIN --><section id="loginPage">  <div class="login-box"><div class="logo">
  MGG <span>STORE</span>
</div>

<div class="subtitle">
  Admin Panel V2026
</div>

<input
  id="username"
  type="text"
  placeholder="Username"
  autocomplete="username"
>

<input
  id="password"
  type="password"
  placeholder="Password"
  autocomplete="current-password"
>

<button class="login-btn" onclick="login()">
  🔐 Login
</button>

<div id="error">
  Invalid username or password
</div>

  </div></section><!-- ADMIN --><section id="adminPage">  <div class="container"><div class="header">

  <h1>
    MGG <span>STORE</span> — Admin
  </h1>

  <div>
    <button class="refresh" onclick="loadOrders()">
      🔄 Refresh
    </button>

    <button class="logout" onclick="logout()">
      Logout
    </button>
  </div>

</div>


<div class="stats">

  <div class="stat">
    <small>Total Orders</small>
    <strong id="total">0</strong>
  </div>

  <div class="stat">
    <small>Payment Pending</small>
    <strong id="pending">0</strong>
  </div>

  <div class="stat">
    <small>Paid</small>
    <strong id="paid">0</strong>
  </div>

  <div class="stat">
    <small>Completed</small>
    <strong id="completed">0</strong>
  </div>

</div>


<div class="orders">

  <div class="orders-title">
    <h2>📦 Orders</h2>
  </div>

  <div id="ordersList">
    <div class="loading">
      Loading orders...
    </div>
  </div>

</div>

  </div></section><script>

/* =====================================
   BACKEND URL
===================================== */

const API_URL =
  "https://mgg-store-backend.onrender.com";


/* =====================================
   LOGIN
===================================== */

function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if(
    username === "admin" &&
    password === "mgg2026"
  ){

    localStorage.setItem(
      "mgg_admin",
      "true"
    );

    showAdmin();

  }else{

    document.getElementById("error").style.display =
      "block";

  }
}


/* =====================================
   SHOW ADMIN
===================================== */

function showAdmin(){

  document.getElementById("loginPage").style.display =
    "none";

  document.getElementById("adminPage").style.display =
    "block";

  loadOrders();
}


/* =====================================
   LOGOUT
===================================== */

function logout(){

  localStorage.removeItem("mgg_admin");

  location.reload();

}


/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders(){

  const list =
    document.getElementById("ordersList");

  list.innerHTML =
    '<div class="loading">Loading orders...</div>';

  try{

    const response =
      await fetch(`${API_URL}/api/orders`);

    if(!response.ok){
      throw new Error("Failed to load orders");
    }

    const result =
      await response.json();

    const orders =
      result.orders || [];

    updateStats(orders);

    if(orders.length === 0){

      list.innerHTML =
        '<div class="empty">📭 No orders yet</div>';

      return;
    }

    list.innerHTML =
      orders
        .slice()
        .reverse()
        .map(order => createOrderHTML(order))
        .join("");

  }catch(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        ❌ Cannot connect to backend.<br><br>
        Check your Render backend URL.
      </div>
    `;

  }

}


/* =====================================
   STATS
===================================== */

function updateStats(orders){

  document.getElementById("total").textContent =
    orders.length;

  document.getElementById("pending").textContent =
    orders.filter(
      o => o.status === "PAYMENT_PENDING"
    ).length;

  document.getElementById("paid").textContent =
    orders.filter(
      o => o.status === "PAID"
    ).length;

  document.getElementById("completed").textContent =
    orders.filter(
      o => o.status === "COMPLETED"
    ).length;

}


/* =====================================
   ORDER HTML
===================================== */

function createOrderHTML(order){

  const status =
    order.status || "UNKNOWN";

  let statusClass = "pending";

  if(status === "PAID")
    statusClass = "paid";

  if(status === "COMPLETED")
    statusClass = "completed";

  if(status === "CANCELLED")
    statusClass = "cancelled";

  return `

    <div class="order">

      <div class="order-top">

        <div class="order-id">
          ${escapeHTML(order.orderId || "-")}
        </div>

        <div class="status ${statusClass}">
          ${escapeHTML(status)}
        </div>

      </div>


      <div class="info">

        <div>
          Game:
          <b>${escapeHTML(order.game || "-")}</b>
        </div>

        <div>
          Package:
          <b>${escapeHTML(order.package || "-")}</b>
        </div>

        <div>
          Player ID:
          <b>${escapeHTML(order.player_id || "-")}</b>
        </div>

        <div>
          Price:
          <b>$${Number(order.price || 0).toFixed(2)}</b>
        </div>

        <div>
          Created:
          <b>${formatDate(order.createdAt)}</b>
        </div>

      </div>


      <div class="actions">

        ${
          status === "PAYMENT_PENDING"
          ? `
            <button
              class="paid-btn"
              onclick="updateStatus('${safe(order.orderId)}','PAID')">
              💵 Paid
            </button>
          `
          : ""
        }


        ${
          status === "PAID"
          ? `
            <button
              class="complete-btn"
              onclick="updateStatus('${safe(order.orderId)}','COMPLETED')">
              ✅ Completed
            </button>
          `
          : ""
        }


        ${
          status !== "COMPLETED" &&
          status !== "CANCELLED"
          ? `
            <button
              class="cancel-btn"
              onclick="updateStatus('${safe(order.orderId)}','CANCELLED')">
              ❌ Cancel
            </button>
          `
          : ""
        }

      </div>

    </div>

  `;
}


/* =====================================
   UPDATE STATUS
===================================== */

async function updateStatus(orderId,status){

  const confirmText =
    `Change order ${orderId} to ${status}?`;

  if(!confirm(confirmText)){
    return;
  }

  try{

    const response =
      await fetch(
        `${API_URL}/api/orders/${encodeURIComponent(orderId)}/status`,
        {
          method:"PATCH",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            status
          })
        }
      );

    const result =
      await response.json();

    if(!response.ok){

      alert(
        result.error ||
        "Failed to update order"
      );

      return;
    }

    await loadOrders();

  }catch(error){

    alert(
      "Cannot connect to backend."
    );

    console.error(error);

  }

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safe(value){

  return String(value || "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}


/* =====================================
   DATE
===================================== */

function formatDate(date){

  if(!date)
    return "-";

  try{

    return new Date(date)
      .toLocaleString();

  }catch{

    return date;

  }

}


/* =====================================
   AUTO LOGIN
===================================== */

if(
  localStorage.getItem("mgg_admin") === "true"
){

  showAdmin();

}

</script></body>
</html>
